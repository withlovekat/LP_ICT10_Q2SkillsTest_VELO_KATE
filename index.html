<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://pyscript.net/releases/2026.7.3/core.css" />
    <script type="module" src="https://pyscript.net/releases/2026.7.3/core.js"> 
    </script><link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link
    href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=Rajdhani:wght@400;600&display=swap" rel="stylesheet">
    <title>🔎 Non-metal Element Checker ˚˖𓍢ִ໋❀</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
    body{background-image: url(polkadot.png);
    background-size: cover; background-repeat: no-repeat; background-position: center; background-attachment: fixed; }
    </style>

    <style>

        .container{
            width: 100%;
            background-color: #FFFFFF;
            border-radius: 20px;
            max-width: 720px;
            overflow: hidden;
            margin-top: 30px;

        }

        .title{
            background-color: #ffc5df;
            text-align: center;
            padding: 24px 16px;
            color: white;
            border-radius: 20px;
        }

        .instructions{
            background: #bffaf6;
            border-left: 4px solid #ffc5df;
            padding: 12px 14px;
            border-radius: 20px;
            margin-bottom: 20px;
            font-size: 14px;
            color: #FFFFFF;
            margin-top: 10px;
        }

        label {
            display: block;
            font-weight: bold;
            color: #ffc5df;
        }

        input{
            width: 100%;
            padding: 10px 12px;
            font-size: 16px;
            border: 1px solid #bffaf6;
            border-radius: 20px;
            margin-bottom: 14px;
            margin-top: -10px;
        }

        button {
            width: 100%;
            padding: 12px;
            font-size: 16px;
            color: #FFFFFF;
            background-color:#ffc5df;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
        }

        .result-section {
            margin-top: 25px;
            color: #ffc5df;
            font-weight: bold;
        }

        .result-box {
            background-color: #bffaf6;
            border-radius: 20px;
            padding: 14px 16px;
            min-height: 90px;
            border-left: 4px solid #ffc5df;
            color: #FFFFFF;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="title">
            <h1>🔎 Non-metal Element Checker ˚˖𓍢ִ໋❀</h1>
            <p>Periodic Table Information Finder</p>
        </div>

        <div class="info">
            <div class="instructions">
                <h6>Enter the symbol of a non-metal element (ex. H, O, Cl, Ne, Xe)</h6>

            </div>
        </div>

        <label for="element-input">Element Symbol</label><br>
        <input id="element-input" type="text" placeholder="Element symbol" /><br>
        <button id="check-btn" py-click="find_element">Check Details</button>

      <div class="result-section">
        <h3>Result</h3>
        <div id="result" class="result-box"></div>
      </div>
    </div>
</div>
    
    <script type="py" src="./main.py"></script>

</body>
</html>
